<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css"></head>
<body>
  <div class="glass-panel">
    <button id="uploadBtn">Choose Image</button>

    <!-- Outline & Feather Controls -->
    <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 14px;">
      <label>Img Feather:</label>
      <input type="range" id="imgFeather" min="0" max="20" value="0" style="width: 80px;">

      <label>Outline:</label>
      <select id="outType" style="padding: 5px; background: #222; color: #fff; border: 1px solid #444;">
        <option value="solid">Solid</option>
        <option value="feathered">Feathered</option>
      </select>

      <input type="color" id="outColor" value="#ffffff" style="padding: 0; width: 30px; height: 30px;">
      <input type="range" id="outWidth" min="0" max="40" value="15" style="flex-grow: 1;">
    </div>

    <!-- Multi-Text Controls -->
    <div style="display: flex; gap: 10px;">
      <input type="text" id="textInput" placeholder="Type text..." style="flex-grow: 1;">
      <button id="addTextBtn">Add Text</button>
    </div>

    <canvas id="preview" width="512" height="512" style="cursor: grab;"></canvas>
    <button id="exportBtn">Export WhatsApp Sticker</button>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
