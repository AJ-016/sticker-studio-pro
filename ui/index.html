<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    
    <!-- Top Action Bar (File Menu) -->
    <div class="top-bar">
      <div class="brand">Sticker Studio Pro</div>
      <div class="global-actions">
        <button id="uploadBtn" class="top-btn">Open Image</button>
        <div class="divider"></div>
        <button id="undoBtn" class="top-btn" title="Undo (Ctrl+Z)">Undo</button>
        <button id="redoBtn" class="top-btn" title="Redo (Ctrl+Y)">Redo</button>
        <div class="divider"></div>
        <input type="text" id="fileName" placeholder="Sticker Name">
        <button id="exportBtn" class="top-btn primary">Export WebP</button>
        <button id="exportHDBtn" class="top-btn secondary">HD PNG</button>
      </div>
    </div>

    <div class="workspace">
      <!-- Left Vertical Toolbar -->
      <div class="toolbar-left">
        <button class="tool-btn active" data-mode="text" data-flyout="flyText" title="Text Tool (T)">
          <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M12 4v16M8 20h8" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="tool-btn" data-mode="image" title="Pan Tool (Space)">
          <svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 00-4 0v4a2 2 0 00-4 0V4a2 2 0 00-4 0v6a2 2 0 00-4 0v8a8 8 0 0016 0V11z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="tool-btn erase-btn" data-mode="erase" data-flyout="flyErase" title="Eraser Tool (E)">
          <svg viewBox="0 0 24 24"><path d="M21 16.52l-5.66 5.66a2 2 0 01-2.83 0L3 12.7A2 2 0 013 9.87L8.66 4.2a2 2 0 012.83 0L21 13.69a2 2 0 010 2.83zM15 15h6" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        
        <div class="horiz-divider"></div>
        
        <button class="tool-btn prop-btn" data-flyout="flyOutline" title="Stroke/Outline Properties">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" fill="none" stroke-width="2" stroke-dasharray="4 4"/></svg>
        </button>
        <button class="tool-btn prop-btn" data-flyout="flyAlign" title="Alignment Options">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="tool-btn prop-btn" data-flyout="flyBg" title="Canvas Background">
          <svg viewBox="0 0 24 24"><path d="M19.2 8.4l-5.6-5.6c-.4-.4-1-.4-1.4 0l-9.6 9.6c-.4.4-.4 1 0 1.4l5.6 5.6c.4.4 1 .4 1.4 0l9.6-9.6c.4-.4.4-1 0-1.4zM13 3l8 8M3 21h18" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <!-- Floating Flyout Panels -->
      <div id="flyText" class="flyout-panel active">
        <div class="flyout-title">Text Properties</div>
        <select id="fontStyle">
          <option value="system-ui">System Default</option>
          <option value="Brush Script MT">Fancy Script</option>
          <option value="Comic Sans MS">Comic Sans</option>
          <option value="Impact">Impact (Meme)</option>
          <option value="Papyrus">Papyrus</option>
          <option value="Georgia">Georgia Serif</option>
        </select>
        <div class="control-row" style="margin-top: 8px;">
          <input type="text" id="textInput" placeholder="Type text...">
          <button id="addTextBtn" class="top-btn" style="padding: 4px 10px;">Add</button>
        </div>
        <div style="font-size: 10px; color: #888; margin-top: 5px;">* Select text on canvas and press DEL to remove</div>
      </div>

      <div id="flyErase" class="flyout-panel">
        <div class="flyout-title">Eraser Brush</div>
        <div class="slider-row">
          <label>Size</label> 
          <input type="range" id="eraseSize" min="5" max="200" value="30">
          <input type="number" id="eraseVal" class="val-input" value="30" min="5" max="200">
        </div>
      </div>

      <div id="flyOutline" class="flyout-panel">
        <div class="flyout-title">Sticker Outline</div>
        <div class="control-row">
          <select id="outType"><option value="solid">Solid</option><option value="feathered">Feathered</option></select>
          <input type="color" id="outColor" value="#ffffff" title="Outline Color">
        </div>
        <div class="slider-row" style="margin-top: 8px;">
          <label>Width</label> 
          <input type="range" id="outWidth" min="0" max="40" value="15">
          <input type="number" id="outVal" class="val-input" value="15" min="0" max="40">
        </div>
      </div>

      <div id="flyAlign" class="flyout-panel">
        <div class="flyout-title">Align Image</div>
        <div class="control-row" style="justify-content: center;">
          <button class="top-btn align-btn" data-align="left">⬅️</button>
          <button class="top-btn align-btn" data-align="center">⏺️</button>
          <button class="top-btn align-btn" data-align="right">➡️</button>
          <button class="top-btn align-btn" data-align="top">⬆️</button>
          <button class="top-btn align-btn" data-align="bottom">⬇️</button>
        </div>
      </div>

      <div id="flyBg" class="flyout-panel">
        <div class="flyout-title">Editor Background</div>
        <div class="control-row">
          <label style="font-size: 12px; color: #bbb;">Color (Editor Only):</label>
          <input type="color" id="canvasBg" value="#121212">
        </div>
      </div>

      <!-- Main Canvas Area -->
      <div class="main-area">
        <div id="canvasWrapper">
          <canvas id="preview" width="512" height="512"></canvas>
        </div>
      </div>
    </div>

    <!-- Bottom Status Bar (Zoom Controls) -->
    <div class="bottom-bar">
      <div class="zoom-controls">
        <span>Zoom:</span>
        <input type="number" id="zoomVal" class="val-input" value="100" min="50" max="5000" style="width: 50px;">
        <span>%</span>
        <input type="range" id="imgZoom" min="0.5" max="50" step="0.05" value="1" style="width: 150px; margin-left: 10px;">
      </div>
      <div class="status-msg">Press ESC to deselect tools • Hold SPACE to Pan</div>
    </div>

  </div>
  <script src="renderer.js"></script>
</body>
</html>
