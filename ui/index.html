<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <div class="sidebar">
      <h3>Sticker Tools</h3>
      <button id="uploadBtn">Choose Image</button>

      <div class="tool-group">
        <label>Image Feathering:</label>
        <input type="range" id="imgFeather" min="0" max="20" value="0">
      </div>
      
      <div class="tool-group">
        <label>Outline Style:</label>
        <select id="outType">
          <option value="solid">Solid</option>
          <option value="feathered">Feathered</option>
        </select>
      </div>

      <div class="tool-group flex-row">
        <input type="color" id="outColor" value="#ffffff" title="Outline Color">
        <input type="range" id="outWidth" min="0" max="40" value="15" title="Outline Thickness">
      </div>

      <div class="tool-group">
        <label>Add/Edit Text:</label>
        <input type="text" id="textInput" placeholder="Type text...">
        <button id="addTextBtn">Add Text</button>
        <button id="deleteTextBtn" style="background: #802020; border-color: #a03030;">Delete Selected Text</button>
      </div>

      <div class="tool-group" style="margin-top: auto;">
        <input type="text" id="fileName" placeholder="Sticker Name (e.g., Happy_Dog)">
        <button id="exportBtn" class="primary-btn">Export WebP Sticker</button>
      </div>
    </div>

    <div class="main-area">
      <canvas id="preview" width="512" height="512" style="cursor: grab;"></canvas>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
