<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Left Sidebar -->
    <div class="sidebar">
      <h3>Sticker Tools</h3>
      <button id="uploadBtn">Choose Image</button>

      <!-- Canvas Tool Mode & Enhanced Zoom -->
      <div class="tool-group">
        <label>Canvas Tool Mode:</label>
        <div class="flex-row" style="background: #222; padding: 8px; border-radius: 6px;">
          <input type="radio" name="toolMode" id="modeText" value="text" checked> 
          <label for="modeText" style="margin-right: 15px; cursor: pointer;">Move Text</label>
          
          <input type="radio" name="toolMode" id="modeImage" value="image"> 
          <label for="modeImage" style="cursor: pointer;">Pan Image (Crop)</label>
        </div>
        <div class="flex-row" style="margin-top: 10px;">
          <label style="width: 40px;">Zoom</label>
          <input type="range" id="imgZoom" min="0.5" max="10" step="0.1" value="1">
        </div>
      </div>
      
      <!-- Outline Tools -->
      <div class="tool-group">
        <label>Outline Style:</label>
        <div class="flex-row">
          <select id="outType" style="flex-grow: 1;">
            <option value="solid">Solid</option>
            <option value="feathered">Feathered</option>
          </select>
          <input type="color" id="outColor" value="#ffffff" title="Outline Color">
        </div>
        <input type="range" id="outWidth" min="0" max="40" value="15" title="Outline Thickness">
      </div>

      <!-- Text Tools -->
      <div class="tool-group">
        <label>Text Options:</label>
        <select id="fontStyle">
          <option value="system-ui">System Default</option>
          <option value="Impact">Impact (Meme)</option>
          <option value="Arial">Arial</option>
          <option value="Comic Sans MS">Comic Sans</option>
          <option value="Courier New">Courier</option>
        </select>
        <input type="text" id="textInput" placeholder="Type text...">
        <div class="flex-row">
          <button id="addTextBtn">Add Text</button>
          <button id="deleteTextBtn" style="background: #8b0000; border-color: #5c0000;">Delete</button>
        </div>
      </div>

      <!-- Export Tools -->
      <div class="tool-group" style="margin-top: auto;">
        <input type="text" id="fileName" placeholder="Sticker Name">
        <button id="exportBtn" class="primary-btn">Export WhatsApp WebP</button>
        <button id="exportHDBtn" style="background: #2a4b7a; border-color: #1a3a5a;">Export HD PNG</button>
      </div>
    </div>

    <!-- Main Canvas Area -->
    <div class="main-area">
      <canvas id="preview" width="512" height="512" style="cursor: grab;"></canvas>
    </div>
  </div>
  
  <script src="renderer.js"></script>
</body>
</html>
